kind: SecurityContextConstraints
apiVersion: security.openshift.io/v1
metadata:
  name: scc-docspace-components
allowPrivilegedContainer: false
runAsUser:
  type: MustRunAsRange
  uidRangeMin: 101
  uidRangeMax: 1001
seLinuxContext:
  type: MustRunAs
fsGroup:
  type: MustRunAs
  ranges:
  - max: 1001
    min: 101
supplementalGroups:
  type: MustRunAs
users: []
groups: []
seccompProfiles:
- runtime/default
