kind: SecurityContextConstraints
apiVersion: security.openshift.io/v1
metadata:
  annotations:
    kubernetes.io/description: "SCC for the external dependencies (MySQL, RabbitMQ, Redis) installed via the bitnami Helm charts. Not for the ONLYOFFICE Apps release, which uses scc-docspace-components."
  name: scc-helm-components
allowPrivilegedContainer: false
runAsUser:
  type: MustRunAsRange
  uidRangeMax: 1001
  uidRangeMin: 1000
seLinuxContext:
  type: MustRunAs
fsGroup:
  type: MustRunAs
  ranges:
  - max: 1001
    min: 1000
supplementalGroups:
  type: MustRunAs
users: []
groups: []
seccompProfiles:
- runtime/default
