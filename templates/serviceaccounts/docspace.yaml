{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "apps.serviceAccountName" . }}
  namespace: {{ include "apps.namespace" . | quote }}
  {{- if .Values.commonLabels }}
  labels:
    {{- include "apps.labels.commonLabels" . | trim | nindent 4 }}
  {{- end }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "3"
    {{- if or .Values.commonAnnotations .Values.serviceAccount.annotations }}
    {{- $dictValue := default .Values.commonAnnotations .Values.serviceAccount.annotations }}
    {{- include "apps.annotations" ( dict "keyName" $dictValue "context" $ ) | nindent 4 }}
    {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
