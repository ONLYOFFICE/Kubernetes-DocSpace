{{- if and .Values.openshift.route.enabled .Values.openshift.route.tls.enabled .Values.openshift.route.tls.letsencrypt.enabled .Values.openshift.route.tls.letsencrypt.issuer.create }}
apiVersion: cert-manager.io/v1
kind: {{ .Values.openshift.route.tls.letsencrypt.issuer.kind }}
metadata:
  name: {{ .Values.openshift.route.tls.letsencrypt.issuer.name }}
  {{- if eq .Values.openshift.route.tls.letsencrypt.issuer.kind "Issuer" }}
  namespace: {{ include "docspace.namespace" . | quote }}
  {{- end }}
  {{- if .Values.commonLabels }}
  labels:
    {{- include "docspace.labels.commonLabels" . | trim | nindent 4 }}
  {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "docspace.annotations" ( dict "keyName" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  acme:
    email: {{ .Values.openshift.route.tls.letsencrypt.email }}
    server: {{ .Values.openshift.route.tls.letsencrypt.server }}
    privateKeySecretRef:
      name: {{ .Values.openshift.route.tls.letsencrypt.issuer.privateKeySecretName }}
    solvers:
    - http01:
        ingress:
          ingressClassName: {{ .Values.openshift.route.tls.letsencrypt.issuer.ingressClassName }}
{{- end }}
