{{- if and .Values.openshift.route.enabled .Values.openshift.route.tls.letsencrypt.enabled .Values.openshift.route.tls.existingSecret }}
  {{- fail "openshift.route.tls.existingSecret cannot be used together with openshift.route.tls.letsencrypt.enabled=true." }}
{{- end }}
{{- if and .Values.openshift.route.enabled .Values.openshift.route.tls.letsencrypt.enabled (not .Values.openshift.route.host) }}
  {{- fail "openshift.route.tls.letsencrypt.enabled=true requires openshift.route.host to be set." }}
{{- end }}
{{- if .Values.openshift.route.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "docspace.route.name" . }}
  namespace: {{ include "docspace.namespace" . | quote }}
  {{- if .Values.commonLabels }}
  labels:
    {{- include "docspace.labels.commonLabels" . | trim | nindent 4 }}
  {{- end }}
  {{- if or .Values.commonAnnotations .Values.openshift.route.annotations }}
  annotations:
    {{- $dictValue := merge (deepCopy .Values.openshift.route.annotations) .Values.commonAnnotations }}
    {{- include "docspace.annotations" ( dict "keyName" $dictValue "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  host: {{ .Values.openshift.route.host }}
  path: /
  wildcardPolicy: {{ .Values.openshift.route.wildcardPolicy }}
  to:
    kind: Service
    name: {{ include "docspace.svc.router.name" . }}
    weight: 100
  port:
    targetPort: {{ .Values.router.service.port.external }}
  {{- if .Values.openshift.route.tls.enabled }}
  tls:
    termination: {{ .Values.openshift.route.tls.termination }}
    {{- if .Values.openshift.route.tls.insecureEdgeTerminationPolicy }}
    insecureEdgeTerminationPolicy: {{ .Values.openshift.route.tls.insecureEdgeTerminationPolicy }}
    {{- end }}
    {{- if and (include "docspace.route.tls.secretName" .) (or (not .Values.openshift.route.tls.letsencrypt.enabled) (lookup "v1" "Secret" (include "docspace.namespace" .) (include "docspace.route.tls.secretName" .))) }}
    externalCertificate:
      name: {{ include "docspace.route.tls.secretName" . }}
    {{- end }}
  {{- end }}
{{- end -}}
