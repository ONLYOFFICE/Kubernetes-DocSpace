{{- if and (eq (include "apps.identity.createSecret" .) "true") .Values.identity.enabled }}
apiVersion: v1
kind: Secret
metadata:
  {{- $secretName := "docspace-identity" }}
  name: {{ $secretName }}
  namespace: {{ include "apps.namespace" . | quote }}
  {{- if .Values.commonLabels }}
  labels:
    {{- include "apps.labels.commonLabels" . | trim | nindent 4 }}
  {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "apps.annotations" ( dict "keyName" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  SPRING_APPLICATION_ENCRYPTION_SECRET: {{ include "apps.generateSecret" (list . (include "apps.identity.springEncryptionValue" .) $secretName "SPRING_APPLICATION_ENCRYPTION_SECRET") | quote }}
{{- end }}
