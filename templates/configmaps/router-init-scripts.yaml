apiVersion: v1
kind: ConfigMap
metadata:
  name: router-init-scripts
  namespace: {{ include "docspace.namespace" . | quote }}
  {{- if .Values.commonLabels }}
  labels:
    {{- include "docspace.labels.commonLabels" . | trim | nindent 4 }}
  {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "docspace.annotations" ( dict "keyName" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
data:
  50-change-router-conf.sh: |-
    #!/bin/sh
    {{- $conf := printf "/etc/nginx/conf.d/%s.conf" .Values.product.name }}
    {{- $services := list
        (dict "serviceName" "api_system"    "serviceUrlVar" "api_system_url"        "host" .Values.connections.apiSystemHost             "port" .Values.apiSystem.containerPorts.app)
        (dict "serviceName" "backup"        "serviceUrlVar" "backup_service_url"    "host" .Values.connections.backupHost                "port" .Values.backup.containerPorts.app)
        (dict "serviceName" "files"         "serviceUrlVar" "files_service_url"     "host" .Values.connections.filesHost                 "port" .Values.files.containerPorts.app)
        (dict "serviceName" "people_server" "serviceUrlVar" "people_service_url"    "host" .Values.connections.peopleServerHost          "port" .Values.peopleServer.containerPorts.app)
        (dict "serviceName" "api"           "serviceUrlVar" "webapi_service_url"    "host" .Values.connections.apiHost                   "port" .Values.api.containerPorts.app)
        (dict "serviceName" "studio"        "serviceUrlVar" "webstudio_service_url" "host" .Values.connections.studioHost                "port" .Values.studio.containerPorts.app)
        (dict "serviceName" "socket"        "serviceUrlVar" "socket_io_url"         "host" .Values.connections.socketHost                "port" .Values.socket.containerPorts.app)
        (dict "serviceName" "sso"           "serviceUrlVar" "sso_service_url"       "host" .Values.connections.ssoauthHost               "port" .Values.ssoauth.containerPorts.app)
        (dict "serviceName" "doceditor"     "serviceUrlVar" "doceditor_service_url" "host" .Values.connections.doceditorHost             "port" .Values.doceditor.containerPorts.app)
        (dict "serviceName" "login"         "serviceUrlVar" "login_service_url"     "host" .Values.connections.loginHost                 "port" .Values.login.containerPorts.app)
        (dict "serviceName" "healthchecks"  "serviceUrlVar" "health_checks_url"     "host" .Values.connections.healthchecksHost          "port" .Values.healthchecks.containerPorts.healthcheck)
        (dict "serviceName" "identity_api"  "serviceUrlVar" "clients_service_url"   "host" .Values.connections.identityApiHost           "port" .Values.identity.api.containerPorts.api)
        (dict "serviceName" "identity"      "serviceUrlVar" "oauth2_service_url"    "host" .Values.connections.identityAuthorizationHost "port" .Values.identity.authorization.containerPorts.authorization)
        (dict "serviceName" "sdk"           "serviceUrlVar" "sdk_node_url"          "host" .Values.connections.sdkHost                   "port" .Values.sdk.containerPorts.sdk)
        (dict "serviceName" "management"    "serviceUrlVar" "management_service_url" "host" .Values.connections.managementHost           "port" .Values.management.containerPorts.management)
        (dict "serviceName" "ai"            "serviceUrlVar" "ai_service_url"        "host" .Values.connections.aiHost                    "port" .Values.ai.containerPorts.app)
        (dict "serviceName" "newai"         "serviceUrlVar" "newai_service_url"     "host" .Values.connections.newaiHost                 "port" .Values.newai.containerPorts.app)
    }}

    {{- range $services }}
    sed -i 's/$service_{{ .serviceName }}/{{ .host }}\:{{ .port }}/g' {{ $conf }}
    sed -i 's/proxy_pass ${{ .serviceUrlVar }}/proxy_pass http:\/\/{{ .host }}\:{{ .port }}/g' {{ $conf }}
    {{- end }}

    {{- if contains "https://" .Values.connections.documentServerHost }}
    sed -i 's/proxy_pass $document_server/proxy_pass https:\/\/{{ trimPrefix "https://" .Values.connections.documentServerHost }}/g' {{ $conf }}
    {{- else if contains "http://" .Values.connections.documentServerHost }}
    sed -i 's/proxy_pass $document_server/proxy_pass http:\/\/{{ trimPrefix "http://" .Values.connections.documentServerHost }}/g' {{ $conf }}
    {{- else if .Values.connections.documentServerUrlExternal }}
    sed -i 's/proxy_pass $document_server/proxy_pass {{ trimSuffix "/" .Values.connections.documentServerUrlExternal | replace ":" "\\:" | replace "/" "\\/" }}/g' {{ $conf }}
    {{- else if and (empty .Values.connections.documentServerUrlExternal) (empty .Values.connections.documentServerHost) }}
    sed -i 's/proxy_pass $document_server/proxy_pass http:\/\/documentserver/g' {{ $conf }}
    {{- else }}
    sed -i 's/proxy_pass $document_server/proxy_pass http:\/\/{{ .Values.connections.documentServerHost | replace ":" "\\:" }}/g' {{ $conf }}
    {{- end }}
    sed '/8092\;/a\        resolver {{ template "docspace.router.resolver" . }}\;' -i {{ $conf }}
    sed '/"oauth2"/,/}/{s|"origin": "[^"]*"|"origin": "'"$OAUTH_ORIGIN"'"|}' -i /var/www/public/scripts/config.json
    rm -rf /etc/nginx/conf.d/upstream.conf
    rm -rf /etc/nginx/conf.d/default.conf
    rm -rf /etc/nginx/includes/server-dashboards.conf
