apiVersion: v1
kind: ConfigMap
metadata:
  name: router-init-scripts
  namespace: {{ include "docspace.namespace" . | quote }}
  {{- if .Values.commonLabels }}
  labels:
    {{- include "docspace.labels.commonLabels" . | trim | nindent 4 }}
  {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "docspace.annotations" ( dict "keyName" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
data:
  50-change-router-conf.sh: |-
    #!/bin/sh
    {{- $services := list
      (dict "token" "api_system"    "var" "api_system_url"      "host" .Values.connections.apiSystemHost              "port" .Values.apiSystem.containerPorts.app)
      (dict "token" "backup"        "var" "backup_service_url"  "host" .Values.connections.backupHost                 "port" .Values.backup.containerPorts.app)
      (dict "token" "files"         "var" "files_service_url"   "host" .Values.connections.filesHost                  "port" .Values.files.containerPorts.app)
      (dict "token" "people_server" "var" "people_service_url"  "host" .Values.connections.peopleServerHost           "port" .Values.peopleServer.containerPorts.app)
      (dict "token" "api"           "var" "webapi_service_url"  "host" .Values.connections.apiHost                    "port" .Values.api.containerPorts.app)
      (dict "token" "studio"        "var" "webstudio_service_url" "host" .Values.connections.studioHost               "port" .Values.studio.containerPorts.app)
      (dict "token" "socket"        "var" "socket_io_url"       "host" .Values.connections.socketHost                 "port" .Values.socket.containerPorts.app)
      (dict "token" "sso"           "var" "sso_service_url"     "host" .Values.connections.ssoauthHost                "port" .Values.ssoauth.containerPorts.app)
      (dict "token" "doceditor"     "var" "doceditor_service_url" "host" .Values.connections.doceditorHost            "port" .Values.doceditor.containerPorts.app)
      (dict "token" "login"         "var" "login_service_url"   "host" .Values.connections.loginHost                  "port" .Values.login.containerPorts.app)
      (dict "token" "healthchecks"  "var" "health_checks_url"   "host" .Values.connections.healthchecksHost           "port" .Values.healthchecks.containerPorts.healthcheck)
      (dict "token" "identity_api"  "var" "clients_service_url" "host" .Values.connections.identityApiHost            "port" .Values.identity.api.containerPorts.api)
      (dict "token" "identity"      "var" "oauth2_service_url"  "host" .Values.connections.identityAuthorizationHost  "port" .Values.identity.authorization.containerPorts.authorization)
      (dict "token" "sdk"           "var" "sdk_node_url"        "host" .Values.connections.sdkHost                    "port" .Values.sdk.containerPorts.sdk)
      (dict "token" "management"    "var" "management_service_url" "host" .Values.connections.managementHost         "port" .Values.management.containerPorts.management)
      (dict "token" "ai"            "var" "ai_service_url"      "host" .Values.connections.aiHost                    "port" .Values.ai.containerPorts.app)
      (dict "token" "new_ai"        "var" "new_ai_service_url"  "host" .Values.connections.newaiHost                  "port" .Values.newai.containerPorts.app)
    }}
    {{- range $services }}
    sed -i 's/$service_{{ .token }}/{{ .host }}\:{{ .port }}/g' /etc/nginx/conf.d/{{ $.Values.product.name }}.conf
    {{- end }}

    {{- range $services }}
    sed -i 's/proxy_pass ${{ .var }}/proxy_pass http:\/\/{{ .host }}\:{{ .port }}/g' /etc/nginx/conf.d/{{ $.Values.product.name }}.conf
    {{- end }}
    {{- if contains "https://" .Values.connections.documentServerHost }}
    sed -i 's/proxy_pass $document_server/proxy_pass https:\/\/{{ trimPrefix "https://" .Values.connections.documentServerHost }}/g' /etc/nginx/conf.d/{{ .Values.product.name }}.conf
    {{- else if contains "http://" .Values.connections.documentServerHost }}
    sed -i 's/proxy_pass $document_server/proxy_pass http:\/\/{{ trimPrefix "http://" .Values.connections.documentServerHost }}/g' /etc/nginx/conf.d/{{ .Values.product.name }}.conf
    {{- else if .Values.connections.documentServerUrlExternal }}
    sed -i 's/proxy_pass $document_server/proxy_pass {{ trimSuffix "/" .Values.connections.documentServerUrlExternal | replace ":" "\\:" | replace "/" "\\/" }}/g' /etc/nginx/conf.d/{{ .Values.product.name }}.conf
    {{- else if and (empty .Values.connections.documentServerUrlExternal) (empty .Values.connections.documentServerHost) }}
    sed -i 's/proxy_pass $document_server/proxy_pass http:\/\/documentserver/g' /etc/nginx/conf.d/{{ .Values.product.name }}.conf
    {{- else }}
    sed -i 's/proxy_pass $document_server/proxy_pass http:\/\/{{ .Values.connections.documentServerHost | replace ":" "\\:" }}/g' /etc/nginx/conf.d/{{ .Values.product.name }}.conf
    {{- end }}
    sed '/8092\;/a\        resolver {{ template "docspace.router.resolver" . }}\;' -i /etc/nginx/conf.d/{{ .Values.product.name }}.conf
    sed '/"oauth2"/,/}/{s|"origin": "[^"]*"|"origin": "'"$OAUTH_ORIGIN"'"|}' -i /var/www/public/scripts/config.json
    rm -rf /etc/nginx/conf.d/upstream.conf
    rm -rf /etc/nginx/conf.d/default.conf
    rm -rf /etc/nginx/includes/server-dashboards.conf
