{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: docspace
  namespace: {{ include "docspace.namespace" . | quote }}
  {{- if .Values.commonLabels }}
  labels:
    {{- include "docspace.labels.commonLabels" . | trim | nindent 4 }}
  {{- end }}
  {{- if or .Values.commonAnnotations .Values.gateway.annotations }}
  annotations:
    {{- $dictValue := default .Values.commonAnnotations .Values.gateway.annotations }}
    {{- include "docspace.annotations" ( dict "keyName" $dictValue "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  {{- $hosts := list }}
  {{- if .Values.gateway.tenants }}
    {{- $hosts = .Values.gateway.tenants }}
  {{- else if .Values.gateway.host }}
    {{- $hosts = list .Values.gateway.host }}
  {{- end }}
  {{- if $hosts }}
  hostnames:
    {{- range $hosts }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  parentRefs:
  {{- if .Values.gateway.external.parentRefs }}
    {{- toYaml .Values.gateway.external.parentRefs | nindent 2 }}
  {{- else }}
  {{- $gwName := include "docspace.gateway.name" . }}
  {{- if $hosts }}
    {{- range $idx, $host := $hosts }}
    {{- if not (and $.Values.gateway.ssl.enabled $.Values.gateway.ssl.redirect.enabled) }}
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gwName }}
      sectionName: {{ printf "http-%d" $idx }}
    {{- end }}
    {{- if $.Values.gateway.ssl.enabled }}
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gwName }}
      sectionName: {{ printf "https-%d" $idx }}
    {{- end }}
    {{- end }}
  {{- else }}
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gwName }}
      sectionName: http
  {{- end }}
  {{- end }}
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: {{ template "docspace.svc.router.name" . }}
      port: {{ .Values.router.service.port.external }}
      weight: 1
{{- end }}
